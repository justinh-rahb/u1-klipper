# Experimental host configuration; do not include on a stock MCU.
# Requires the matching patched host/helper and phase-enabled mainboard MCU.
# Defaults leave phase stepping OFF until explicitly enabled.
[phase_stepping stepper_x]
auto_enable: False

[phase_stepping stepper_y]
auto_enable: False

# Stock U1 toolhead 0 accelerometer; must be the attached toolhead.
[phase_calibrate]
accel_chip: lis2dw e0_lis2dw
speed_min: 30
speed_max: 80
