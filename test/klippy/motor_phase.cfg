# Test config for motor_phase_calibrate with SPI-connected TMC2240
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 10
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 10
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[tmc2240 stepper_x]
cs_pin: PK3
run_current: 1.2

[tmc2240 stepper_y]
cs_pin: PK4
run_current: 1.2

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
max_logical_extruder_num: 1
max_physical_extruder_num: 1

[motor_phase_calibrate]
axes: x, y
accel_chip: lis2dw
# Exercise the stored-correction parse path
x_forward_correction: 2:0.012:1.5,4:0.004:-0.7
x_reverse_correction: 2:0.011:1.6,4:0.005:-0.6
x_phase_invert: 1
